name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk zad-v1.1.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: ZAD v1.1
          body: ZAD v1.1 - new package id, new icon. Created with care by ahmed dawood
          files: zad-v1.1.apk
