name: Build release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk zad-v1.4.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4
          name: ZAD v1.4
          body: "ZAD v1.4 - drawn quick-action icons, flippable hero card with per-account balances, e-wallet account type, slower theme transitions, and fixes for photo picker, receipt photo, notifications, and custom categories. Created with care by ahmed dawood"
          files: zad-v1.4.apk
